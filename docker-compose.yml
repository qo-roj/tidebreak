# Tidebreak — Docker Compose
# Runs Tidebreak gateway + Ollama for local-only content processing.
#
# Usage:
#   docker compose up -d
#   tidebreak audit --live   # monitor from host

services:
  tidebreak:
    build: .
    container_name: tidebreak
    restart: unless-stopped
    ports:
      - "8842:8842"
    volumes:
      - ./config:/etc/tidebreak:ro
      - tidebreak-data:/var/lib/tidebreak
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - TIDEBREAK_OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - tidebreak-net

  ollama:
    image: ollama/ollama:latest
    container_name: tidebreak-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - tidebreak-net

volumes:
  tidebreak-data:
  ollama-models:

networks:
  tidebreak-net:
    driver: bridge