# Tidegate — Docker Compose
# Runs Tidegate gateway + Ollama for local-only content processing.
#
# Usage:
#   docker compose up -d
#   tidegate audit --live   # monitor from host

services:
  tidegate:
    build: .
    container_name: tidegate
    restart: unless-stopped
    ports:
      - "8842:8842"
    volumes:
      - ./config:/etc/tidegate:ro
      - tidegate-data:/var/lib/tidegate
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - TIDEGATE_OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - tidegate-net

  ollama:
    image: ollama/ollama:latest
    container_name: tidegate-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - tidegate-net

volumes:
  tidegate-data:
  ollama-models:

networks:
  tidegate-net:
    driver: bridge