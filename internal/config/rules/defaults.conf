# Built-in Default Rules for Tidebreak
# These ship with the binary and are always loaded first.
# User config (~/.config/tidebreak/tidebreak.conf) extends/overrides these.

# ─────────────────────────────────────────────────────
# BLOCK — never accessible by any agent via any model
# ─────────────────────────────────────────────────────
[block]
~/.ssh/id_*
~/.ssh/known_hosts
~/.gnupg/**
~/.password-store/**
~/.local/share/pass/**
~/.config/bitwarden/**
~/.git-credentials
~/.config/gh/hosts.yml
/etc/shadow
/etc/gshadow

# ─────────────────────────────────────────────────────
# LOCAL-ONLY — route to Ollama, never to cloud
# ─────────────────────────────────────────────────────
[local-only]
# Environment / secrets
~/.envrc
**/.env
**/.env.*
**/credentials*
**/secret*

# Mail
~/.config/himalaya/**
~/.thunderbird/**

# Financial / personal docs
~/Documents/finances/**
~/Documents/taxes/**
~/Documents/medical/**

# SSL / Let's Encrypt — private keys and certs never leave the host
/etc/letsencrypt/**

# Browser data (cookies, history contain PII)
~/.config/chromium/Cookies
~/.config/chromium/History
~/.config/chromium/Login Data
~/.mozilla/firefox/**/cookies.sqlite
~/.mozilla/firefox/**/places.sqlite

# ─────────────────────────────────────────────────────
# REDACT — send to cloud but scrub sensitive patterns
# ─────────────────────────────────────────────────────
[redact]
# Shell history (contains pasted secrets)
~/.zsh_history
~/.bash_history
~/.local/share/fish/history

# System logs
/var/log/nginx/access.log
/var/log/nginx/error.log
/var/log/auth.log
/var/log/syslog

# Process listings (command args may contain secrets)
ps aux
ss -tlnp

# ─────────────────────────────────────────────────────
# Patterns enabled by default
# ─────────────────────────────────────────────────────
[redaction.patterns]
ipv4 = true
ipv6 = true
email = true
phone = true
api_key_github = true     # ghp_*, gho_*, ghs_*, ghu_*
api_key_openai = true      # sk-proj-*, sk-*
api_key_anthropic = true   # sk-ant-*
api_key_aws = true         # AKIA*
api_key_google = true     # AIza*
api_key_stripe = true     # sk_live_*, sk_test_*
jwt = true                 # eyJ...
private_key = true         # -----BEGIN ... PRIVATE KEY-----
mac_address = true
credit_card = true